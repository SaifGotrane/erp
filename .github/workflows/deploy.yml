```yaml
name: Deploy Flutter Web to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Desktop/jabnoun erp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create frontend environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_ANON_KEY" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Verify Cloudflare configuration
        run: |
          echo "=== Current directory ==="
          pwd

          echo ""
          echo "=== Wrangler configuration ==="
          cat wrangler.toml

          echo ""
          echo "=== Flutter Web build ==="
          test -f build/web/index.html
          echo "build/web/index.html OK"

          echo ""
          echo "=== Build files ==="
          ls -la build/web

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: Desktop/jabnoun erp
```
